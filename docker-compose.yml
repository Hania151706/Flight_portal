services:
  db:
    image: postgres:16-alpine
    container_name: mgh-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mgh_portal
      POSTGRES_USER: mgh
      POSTGRES_PASSWORD: mgh_local_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mgh -d mgh_portal"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./server
    container_name: mgh-api
    environment:
      DATABASE_URL: postgresql://mgh:mgh_local_password@db:5432/mgh_portal?schema=public
      JWT_SECRET: local_demo_change_this_secret_before_real_deployment
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:5173
    ports: ["4000:4000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./client
    container_name: mgh-web
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:4000/api
    depends_on: [api]
volumes:
  postgres_data:
